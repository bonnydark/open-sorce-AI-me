services:
  gortgpt-core-model:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gortgpt-core-model
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./models:/models:ro
    command:
      - "-m"
      - "/models/model.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "8192"
      - "--alias"
      - "local-model"
