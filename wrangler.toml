name = "openai"
main = "src/index.js"
compatibility_date = "2026-10-13"
workers_dev = true

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "open-sorce-ai-me-db"
database_id = "db246638-4bd8-4e26-85ce-52fe450c4404"
migrations_dir = "migrations"
