name = "openai"
main = "src/index.js"
compatibility_date = "2026-10-13"
workers_dev = true

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "none"
run_worker_first = ["/*"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "open-sorce-ai-me-db"
database_id = "db246638-4bd8-4e26-85ce-52fe450c4404"
migrations_dir = "migrations"

[vars]
AI_ESTIMATED_COST_PER_IMAGE_USD = "0.001"
AI_ESTIMATED_COST_PER_REQUEST_USD = "0.001"
